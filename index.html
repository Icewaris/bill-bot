<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บอทหารตังค์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#E91E8C;--pink-light:#fce4f3;--teal:#00BCD4;--teal-light:#e0f7fa;--green:#00C853;--green-light:#e8f5e9;--red:#F44336;--red-light:#ffebee;--gray:#f5f5f5;--gray2:#eeeeee;--text:#1a1a2e;--text2:#666;--text3:#999;--white:#ffffff;--radius:16px;--radius-sm:10px;--shadow:0 2px 16px rgba(233,30,140,0.10);--shadow-sm:0 1px 6px rgba(0,0,0,0.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#faf5f9;font-family:'Sarabun',sans-serif;color:var(--text)}
.nav{display:flex;background:var(--white);border-bottom:1.5px solid var(--pink-light);position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text3);border:none;background:none;cursor:pointer;position:relative;font-family:'Sarabun',sans-serif}
.nav-btn.active{color:var(--pink)}
.nav-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2.5px;background:var(--pink);border-radius:2px 2px 0 0}
.nav-icon{font-size:20px;line-height:1}
.page{display:none;padding:16px;padding-bottom:32px;max-width:480px;margin:0 auto}
.page.active{display:block}
.month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-label{font-family:'Prompt',sans-serif;font-size:18px;color:var(--text);font-weight:700}
.month-btn{background:var(--gray);border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;color:var(--text2)}
.card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.balance-label{font-size:12px;color:var(--text3);margin-bottom:4px}
.balance-amount{font-family:'Prompt',sans-serif;font-size:32px;font-weight:700;margin-bottom:12px;color:var(--red)}
.balance-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.balance-box{border-radius:var(--radius-sm);padding:12px 14px}
.balance-box.expense{background:var(--pink-light)}
.balance-box.income{background:var(--teal-light)}
.balance-box-label{font-size:11px;margin-bottom:3px}
.expense .balance-box-label{color:var(--pink)}
.income .balance-box-label{color:var(--teal)}
.balance-box-amount{font-family:'Prompt',sans-serif;font-size:18px;font-weight:700}
.expense .balance-box-amount{color:var(--pink)}
.income .balance-box-amount{color:var(--teal)}
.card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px}
.chart-wrap{display:flex;align-items:center;gap:16px}
.chart-canvas-wrap{width:120px;height:120px;flex-shrink:0;position:relative}
.legend-item{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.legend-dot-name{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-name{font-size:12px;color:var(--text2)}
.legend-val{font-size:12px;font-weight:700;color:var(--text)}
.debt-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray)}
.debt-row:last-child{border-bottom:none}
.debt-person{display:flex;align-items:center;gap:10px}
.debt-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.debt-info{font-size:13px;color:var(--text)}
.debt-sub{font-size:11px;color:var(--text3);margin-top:1px}
.debt-amount{font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;color:var(--red)}
.paid-btn{background:var(--green);color:#fff;border:none;border-radius:20px;padding:5px 14px;font-size:12px;font-family:'Sarabun',sans-serif;cursor:pointer;margin-left:8px;font-weight:700}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;border:1.5px solid var(--gray2);background:var(--white);color:var(--text2);cursor:pointer;font-family:'Sarabun',sans-serif;white-space:nowrap}
.filter-chip.active{background:var(--pink);border-color:var(--pink);color:#fff}
.bill-group{margin-bottom:18px}
.bill-group-label{font-size:11px;color:var(--text3);margin-bottom:8px;padding-left:2px}
.bill-item{background:var(--white);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.bill-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:2px}
.bill-info{flex:1;min-width:0}
.bill-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-meta{font-size:11px;color:var(--text3);margin-top:2px}
.bill-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.bill-amount{font-family:'Prompt',sans-serif;font-size:15px;font-weight:700;color:var(--pink)}
.bill-actions{display:flex;gap:6px}
.bill-action-btn{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.btn-edit{background:var(--gray2)}
.btn-delete{background:var(--red-light)}
.status-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.status-badge.pending{background:var(--pink-light);color:var(--pink)}
.status-badge.paid{background:var(--green-light);color:var(--green)}
.member-item{background:var(--white);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.member-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:24px 24px 0 0;padding:20px 16px 40px;width:100%;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--gray2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:18px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:700}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--gray2);border-radius:var(--radius-sm);font-size:14px;font-family:'Sarabun',sans-serif;color:var(--text);margin-bottom:14px;outline:none;background:var(--white)}
.form-input:focus{border-color:var(--pink)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cat-chip{padding:6px 12px;border-radius:20px;font-size:12px;border:1.5px solid var(--gray2);background:var(--white);cursor:pointer;font-family:'Sarabun',sans-serif}
.cat-chip.selected{border-color:var(--pink);background:var(--pink-light);color:var(--pink);font-weight:700}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:'Prompt',sans-serif;border:none;cursor:pointer}
.btn-cancel{background:var(--gray);color:var(--text2)}
.btn-save{background:var(--pink);color:#fff}
.btn-del-full{background:var(--red-light);color:var(--red);grid-column:1/-1}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
</style>
</head>
<body>
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('summary')" id="nav-summary"><span class="nav-icon">🏠</span><span>สรุป</span></button>
  <button class="nav-btn" onclick="showPage('bills')" id="nav-bills"><span class="nav-icon">📋</span><span>รายการ</span></button>
  <button class="nav-btn" onclick="showPage('members')" id="nav-members"><span class="nav-icon">👥</span><span>สมาชิก</span></button>
</nav>

<div class="page active" id="page-summary">
  <div class="month-row">
    <div class="month-label" id="month-label">พฤษภาคม 2569</div>
    <button class="month-btn" onclick="showToast('เปลี่ยนเดือนได้เลย')">◀ ▶ เดือน</button>
  </div>
  <div class="card">
    <div class="balance-label">ยอดสุทธิรอบนี้</div>
    <div class="balance-amount" id="balance-total">฿0</div>
    <div class="balance-row">
      <div class="balance-box expense"><div class="balance-box-label">รายจ่าย</div><div class="balance-box-amount" id="total-expense">฿0</div></div>
      <div class="balance-box income"><div class="balance-box-label">รายรับ</div><div class="balance-box-amount" id="total-income">฿0</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">สัดส่วนรายจ่าย</div>
    <div class="chart-wrap">
      <div class="chart-canvas-wrap"><canvas id="pieChart" width="120" height="120"></canvas></div>
      <div style="flex:1" id="chart-legend"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">💸 ยอดค้าง</div>
    <div id="debt-list"></div>
  </div>
</div>

<div class="page" id="page-bills">
  <div class="filter-row">
    <button class="filter-chip active" onclick="filterBills('all',this)">ทั้งหมด</button>
    <button class="filter-chip" onclick="filterBills('อาหาร',this)">🍜 อาหาร</button>
    <button class="filter-chip" onclick="filterBills('เครื่องดื่ม',this)">🥤 เครื่องดื่ม</button>
    <button class="filter-chip" onclick="filterBills('ชอปปิ้ง',this)">🛒 ชอปปิ้ง</button>
    <button class="filter-chip" onclick="filterBills('อื่นๆ',this)">📦 อื่นๆ</button>
  </div>
  <div id="bills-list"></div>
</div>

<div class="page" id="page-members">
  <div style="font-size:12px;color:var(--text3);margin-bottom:12px">กด ✏️ เพื่อแก้ไขชื่อ</div>
  <div id="members-list"></div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">แก้ไขรายการ</div>
    <div class="form-label">ชื่อรายการ</div>
    <input class="form-input" id="edit-name" placeholder="เช่น ข้าวผัด">
    <div class="form-row">
      <div><div class="form-label">จำนวนเงิน (฿)</div><input class="form-input" id="edit-amount" type="number"></div>
      <div><div class="form-label">จ่ายโดย</div><input class="form-input" id="edit-paidby"></div>
    </div>
    <div class="form-label">หมวดหมู่</div>
    <div class="cat-select" id="cat-select">
      <button class="cat-chip selected" onclick="selectCat(this,'อาหาร')">🍜 อาหาร</button>
      <button class="cat-chip" onclick="selectCat(this,'เครื่องดื่ม')">🥤 เครื่องดื่ม</button>
      <button class="cat-chip" onclick="selectCat(this,'ชอปปิ้ง')">🛒 ชอปปิ้ง</button>
      <button class="cat-chip" onclick="selectCat(this,'อื่นๆ')">📦 อื่นๆ</button>
    </div>
    <div class="form-label">สถานะ</div>
    <div class="cat-select" id="status-select">
      <button class="cat-chip selected" onclick="selectStatus(this,'pending')">⏳ ค้างอยู่</button>
      <button class="cat-chip" onclick="selectStatus(this,'paid')">✅ จ่ายแล้ว</button>
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-save" onclick="saveEdit()">บันทึก ✓</button>
      <button class="btn btn-del-full" onclick="deleteItem()">🗑 ลบรายการนี้</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="rename-modal" onclick="if(event.target===this)closeRename()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">แก้ไขชื่อสมาชิก</div>
    <div class="form-label">ชื่อปัจจุบัน</div>
    <input class="form-input" id="old-name" readonly style="background:var(--gray);color:var(--text3)">
    <div class="form-label">ชื่อใหม่</div>
    <input class="form-input" id="new-name" placeholder="ใส่ชื่อใหม่">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeRename()">ยกเลิก</button>
      <button class="btn btn-save" onclick="doRename()">บันทึก ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var bills=[
  {id:1,date:'2025-05-31',name:'ชาบู',amount:450,paidBy:'มิ้ว',members:['เรา','มิ้ว','โอ้'],sharePerPerson:150,category:'อาหาร',status:'pending'},
  {id:2,date:'2025-05-31',name:'เบียร์',amount:180,paidBy:'มิ้ว',members:['โอ้'],sharePerPerson:180,category:'เครื่องดื่ม',status:'pending'},
  {id:3,date:'2025-05-31',name:'น้ำ Amazon',amount:55,paidBy:'เรา',members:['เรา'],sharePerPerson:55,category:'เครื่องดื่ม',status:'paid'},
  {id:4,date:'2025-05-30',name:'ยาคูล',amount:192,paidBy:'โอ้',members:['เรา','โอ้'],sharePerPerson:96,category:'เครื่องดื่ม',status:'pending'},
  {id:5,date:'2025-05-30',name:'ทุเรียน',amount:250,paidBy:'เรา',members:['เรา','มิ้ว'],sharePerPerson:125,category:'อาหาร',status:'pending'},
  {id:6,date:'2025-05-29',name:'7-11',amount:335,paidBy:'มิ้ว',members:['เรา','มิ้ว','โอ้'],sharePerPerson:112,category:'ชอปปิ้ง',status:'paid'}
];
var members=[
  {name:'เรา',color:'#E91E8C',emoji:'😊'},
  {name:'มิ้ว',color:'#00BCD4',emoji:'🌸'},
  {name:'โอ้',color:'#FF9800',emoji:'⭐'}
];
var currentFilter='all';
var editingId=null;
var editCat='อาหาร';
var editStatus='pending';
var pieChartInstance=null;
var catColors={'อาหาร':'#E91E8C','เครื่องดื่ม':'#00BCD4','ชอปปิ้ง':'#FF9800','อื่นๆ':'#9C27B0'};

function showPage(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
  document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active')});
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='summary')renderSummary();
  if(p==='bills')renderBills();
  if(p==='members')renderMembers();
}

function renderSummary(){
  var totalExpense=bills.reduce(function(s,b){return s+b.amount},0);
  var net=-totalExpense;
  document.getElementById('total-expense').textContent='฿'+totalExpense.toLocaleString();
  document.getElementById('total-income').textContent='฿0';
  document.getElementById('balance-total').textContent=(net>=0?'+':'')+'฿'+Math.abs(net).toLocaleString();

  // chart
  var cats={};
  bills.forEach(function(b){cats[b.category]=(cats[b.category]||0)+b.amount});
  var labels=Object.keys(cats);
  var data=labels.map(function(l){return cats[l]});
  var colors=labels.map(function(l){return catColors[l]||'#ccc'});

  // legend always renders
  var legendEl=document.getElementById('chart-legend');
  legendEl.innerHTML=labels.map(function(l,i){
    return '<div class="legend-item"><div class="legend-dot-name"><div class="legend-dot" style="background:'+colors[i]+'"></div><span class="legend-name">'+l+'</span></div><span class="legend-val">฿'+data[i].toLocaleString()+'</span></div>';
  }).join('');

  // try chart
  tryDrawChart(labels,data,colors);

  // debts
  var debts=calcDebts();
  var debtEl=document.getElementById('debt-list');
  if(debts.length===0){
    debtEl.innerHTML='<div style="text-align:center;padding:16px;color:var(--text3);font-size:13px">✅ ไม่มียอดค้าง</div>';
  } else {
    debtEl.innerHTML=debts.map(function(d){
      var m=members.find(function(x){return x.name===d.from})||{color:'#ccc',emoji:'👤'};
      return '<div class="debt-row"><div class="debt-person"><div class="debt-avatar" style="background:'+m.color+'20;color:'+m.color+'">'+m.emoji+'</div><div><div class="debt-info"><b>'+d.from+'</b> ค้าง <b>'+d.to+'</b></div><div class="debt-sub">'+d.items+'</div></div></div><div style="display:flex;align-items:center"><div class="debt-amount">฿'+d.amount.toLocaleString()+'</div><button class="paid-btn" onclick="markPaid(\''+d.from+'\',\''+d.to+'\')">จ่ายแล้ว</button></div></div>';
    }).join('');
  }
}

function tryDrawChart(labels,data,colors){
  var canvas=document.getElementById('pieChart');
  if(!canvas) return;
  if(typeof Chart==='undefined'){
    setTimeout(function(){tryDrawChart(labels,data,colors)},500);
    return;
  }
  if(pieChartInstance){pieChartInstance.destroy();pieChartInstance=null;}
  try{
    pieChartInstance=new Chart(canvas,{
      type:'doughnut',
      data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:0,hoverOffset:4}]},
      options:{cutout:'65%',plugins:{legend:{display:false},tooltip:{enabled:false}},animation:{duration:500}}
    });
  }catch(e){console.log('chart error',e);}
}

function calcDebts(){
  var pending=bills.filter(function(b){return b.status==='pending'});
  var balances={};
  pending.forEach(function(b){
    b.members.forEach(function(m){
      if(m!==b.paidBy){
        var key=m+'→'+b.paidBy;
        balances[key]=(balances[key]||0)+b.sharePerPerson;
      }
    });
  });
  return Object.entries(balances).map(function(e){
    var from=e[0].split('→')[0],to=e[0].split('→')[1];
    var items=pending.filter(function(b){return b.members.includes(from)&&b.paidBy===to}).map(function(b){return b.name}).join(', ');
    return {from:from,to:to,amount:e[1],items:items};
  }).filter(function(d){return d.amount>0});
}

function markPaid(from,to){
  bills.forEach(function(b){
    if(b.status==='pending'&&b.members.includes(from)&&b.paidBy===to) b.status='paid';
  });
  renderSummary();
  showToast('✅ '+from+' จ่าย '+to+' แล้ว');
}

function renderBills(){
  var filtered=currentFilter==='all'?bills:bills.filter(function(b){return b.category===currentFilter});
  var groups={};
  filtered.forEach(function(b){
    var d=new Date(b.date);
    var months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    var label=d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543);
    if(!groups[label])groups[label]=[];
    groups[label].push(b);
  });
  var el=document.getElementById('bills-list');
  if(Object.keys(groups).length===0){el.innerHTML='<div class="empty">🧾<br>ไม่มีรายการ</div>';return;}
  el.innerHTML=Object.entries(groups).map(function(g){
    return '<div class="bill-group"><div class="bill-group-label">'+g[0]+'</div>'+
    g[1].map(function(b){
      return '<div class="bill-item"><div class="bill-cat-dot" style="background:'+(catColors[b.category]||'#ccc')+'"></div><div class="bill-info"><div class="bill-name">'+b.name+'</div><div class="bill-meta">'+b.members.join(', ')+' · จ่ายโดย '+b.paidBy+'</div></div><div class="bill-right"><div style="display:flex;align-items:center;gap:6px"><div class="bill-amount">฿'+b.amount.toLocaleString()+'</div><span class="status-badge '+b.status+'">'+(b.status==='paid'?'✓':'รอ')+'</span></div><div class="bill-actions"><button class="bill-action-btn btn-edit" onclick="openEdit('+b.id+')">✏️</button><button class="bill-action-btn btn-delete" onclick="deleteById('+b.id+')">✕</button></div></div></div>';
    }).join('')+'</div>';
  }).join('');
}

function filterBills(cat,el){
  currentFilter=cat;
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')});
  el.classList.add('active');
  renderBills();
}

function renderMembers(){
  document.getElementById('members-list').innerHTML=members.map(function(m){
    return '<div class="member-item"><div class="member-avatar" style="background:'+m.color+'20;color:'+m.color+'">'+m.emoji+'</div><div class="bill-info"><div class="bill-name">'+m.name+'</div><div class="bill-meta">สมาชิก</div></div><button class="bill-action-btn btn-edit" onclick="openRename(\''+m.name+'\')">✏️</button></div>';
  }).join('');
}

function openEdit(id){
  var b=bills.find(function(x){return x.id===id});
  if(!b)return;
  editingId=id; editCat=b.category; editStatus=b.status;
  document.getElementById('modal-title').textContent='แก้ไข: '+b.name;
  document.getElementById('edit-name').value=b.name;
  document.getElementById('edit-amount').value=b.amount;
  document.getElementById('edit-paidby').value=b.paidBy;
  document.querySelectorAll('#cat-select .cat-chip').forEach(function(c){c.classList.toggle('selected',c.textContent.includes(b.category))});
  document.querySelectorAll('#status-select .cat-chip').forEach(function(c){c.classList.toggle('selected',(b.status==='pending'&&c.textContent.includes('ค้าง'))||(b.status==='paid'&&c.textContent.includes('จ่าย')))});
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}
function saveEdit(){
  if(!editingId)return;
  var b=bills.find(function(x){return x.id===editingId});
  if(!b)return;
  b.name=document.getElementById('edit-name').value||b.name;
  b.amount=parseFloat(document.getElementById('edit-amount').value)||b.amount;
  b.paidBy=document.getElementById('edit-paidby').value||b.paidBy;
  b.category=editCat; b.status=editStatus;
  closeModal(); renderBills(); showToast('✅ บันทึกแล้ว');
}
function deleteItem(){
  if(!editingId)return;
  bills=bills.filter(function(x){return x.id!==editingId});
  closeModal(); renderBills(); showToast('🗑 ลบแล้ว');
}
function deleteById(id){
  bills=bills.filter(function(x){return x.id!==id});
  renderBills(); showToast('🗑 ลบแล้ว');
}
function selectCat(el,cat){
  editCat=cat;
  document.querySelectorAll('#cat-select .cat-chip').forEach(function(c){c.classList.remove('selected')});
  el.classList.add('selected');
}
function selectStatus(el,status){
  editStatus=status;
  document.querySelectorAll('#status-select .cat-chip').forEach(function(c){c.classList.remove('selected')});
  el.classList.add('selected');
}
function openRename(name){
  document.getElementById('old-name').value=name;
  document.getElementById('new-name').value='';
  document.getElementById('rename-modal').classList.add('open');
}
function closeRename(){document.getElementById('rename-modal').classList.remove('open');}
function doRename(){
  var n=document.getElementById('new-name').value.trim();
  var o=document.getElementById('old-name').value;
  if(!n){showToast('⚠️ ใส่ชื่อใหม่ด้วย');return;}
  var m=members.find(function(x){return x.name===o});
  if(m){
    bills.forEach(function(b){
      b.members=b.members.map(function(x){return x===o?n:x});
      if(b.paidBy===o)b.paidBy=n;
    });
    m.name=n;
  }
  closeRename(); renderMembers(); renderSummary(); showToast('✅ เปลี่ยน "'+o+'" → "'+n+'" แล้ว');
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}

// Load Chart.js then render
var s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
s.onload=function(){renderSummary()};
s.onerror=function(){renderSummary()};
document.head.appendChild(s);

renderSummary();
renderBills();
renderMembers();
</script>
</body>
</html>
